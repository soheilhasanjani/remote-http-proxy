# Optional Docker Compose deployment
services:
  gost-proxy:
    image: ginuerzh/gost:latest
    container_name: dual-proxy
    restart: always
    ports:
      - "18080:18080"
      - "18443:18443"
    volumes:
      - /etc/gost:/etc/gost:ro
    command: -L=http://soheilhm:Soheil2026Secure@:18080 -L=https://soheilhm:Soheil2026Secure@:18443?cert=/etc/gost/proxy.crt&key=/etc/gost/proxy.key
