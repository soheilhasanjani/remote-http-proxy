# Alternative: Run via Docker instead of native script if preferred
# Usage:
#   docker compose up -d
services:
  http-proxy:
    image: ginuerzh/gost:latest
    container_name: remote-http-proxy
    restart: always
    ports:
      - "${PROXY_PORT:-18080}:18080"
    # Replace user:pass with your desired credentials, or remove for no-auth
    command: -L=http://admin:changeMePassword123@:18080
